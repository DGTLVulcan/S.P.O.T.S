# Copy this file to config.yaml and edit for your setup.
# config.yaml is gitignored so your camera IP / local paths don't get committed.

camera:
  # "zcam" for a real Z CAM E2-series camera over the network, "synthetic" for
  # local development/testing without any hardware attached.
  source: synthetic
  # Blank auto-discovers the camera on the Ethernet link, which is the normal
  # field setup. Set it only to pin a known IP and skip discovery.
  ip: ""
  stream_width: 1920
  stream_height: 1080
  stream_bitrate: 8000000
  # Software crop+resize zoom, for when the lens can't get close enough.
  # 1.0 is no zoom. These are the startup defaults; it is adjustable live.
  digital_zoom: 1.0
  zoom_center_x: 0.5
  zoom_center_y: 0.5

target:
  # Real-world width of the paper target, for pixel to real-world
  # calibration. Units are whatever you want groups reported in.
  width_units: 59.0
  unit_name: cm
  # Distance to target in metres, for converting group size to MOA; 0 is
  # unset and MOA is omitted. Needs unit_name to be one of mm/cm/m/in/ft.
  distance_m: 0.0
  # "Best N-shot subgroup" sizes to report once that many shots exist.
  best_subgroup_sizes: [3, 5]
  # Above this many shots in a session, the subgroup search is skipped
  # (it's combinatorial: n-choose-k) rather than eating Pi CPU every poll.
  best_subgroup_max_shots: 30

detection:
  sample_fps: 3
  # Low enough to catch a hole on a dark printed ring; noise is rejected by
  # area, circularity and the debounce below rather than by a high threshold.
  # Raise it if lighting flicker causes false positives.
  diff_threshold: 20
  # Hole size range in pixels squared, before calibration scaling. The
  # defaults assume a medium pistol calibre at a typical bay distance.
  min_hole_area_px: 20
  max_hole_area_px: 400
  min_circularity: 0.5
  # Max pixel drift when matching a candidate to the same hole on the
  # previous frame, for the debounce. Not a minimum spacing between shots:
  # tight groups are handled by reference burn-in.
  min_shot_spacing_px: 12
  debounce_frames: 2
  # Re-aligns each frame onto the reference by ORB matching and a homography
  # before diffing, so a swaying target doesn't produce false shots.
  realignment_enabled: true
  realignment_method: orb  # "orb" or "sift"
  realignment_min_matches: 15

storage:
  db_path: spots.db
  snapshot_dir: snapshots

web:
  host: 0.0.0.0
  port: 8080
  # Dashboard video stream. Each frame costs an overlay draw and a JPEG
  # encode per viewer, which is the largest steady CPU cost on a Pi. Shots
  # are still found at detection.sample_fps whatever the stream is doing.
  stream_fps: 10
  stream_quality: 80
  # Caps the streamed picture's width in pixels; 0 is native. Only affects
  # what is sent to the browser, never detection. Native 1080p is about
  # 18 Mbit/s, more than a Pi hosting its own 2.4GHz WiFi carries.
  stream_max_width: 960
