<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S.P.O.T.S - Equipment</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="appbar">
    {% set active = 'spots.equipment_page' %}
    {% include '_menu.html' %}
    <div class="brand">
      <h1>S.P.O.T.S</h1>
      <span class="subtitle">Equipment</span>
    </div>
    <div class="icon-nav">
      {% include '_range_toggle.html' %}
      <button id="theme-toggle" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">&#9788;</button>
    </div>
  </header>

  {% include '_range_banner.html' %}

  <main class="equip-main">
    <div class="equip-layout">
      <aside class="equip-sidebar card" id="equip-sidebar">
        <p class="empty-state">Loading...</p>
      </aside>
      <section class="equip-detail card" id="equip-detail">
        <p class="empty-state">Loading...</p>
      </section>
    </div>
  </main>

  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  <script src="{{ url_for('static', filename='range_status.js') }}"></script>
  <script src="{{ url_for('static', filename='menu.js') }}"></script>
  <script src="{{ url_for('static', filename='equipment.js') }}"></script>
</body>
</html>
