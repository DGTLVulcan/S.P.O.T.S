<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  html, body { margin: 0; padding: 0; background: #0b0b0b; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
  .disp { font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif; }
</style>
</head>
<body>

<div class="disp" style="width: 1600px; height: 900px; background: #0b0b0b; position: relative; overflow: hidden;">

  <div style="position: absolute; inset: 0; background: radial-gradient(56% 96% at 36% 50%, rgba(57,135,229,0.15) 0%, rgba(11,11,11,0) 64%); pointer-events: none;"></div>

  <svg viewBox="0 0 640 640" style="position: absolute; left: 268px; top: 122px; width: 656px; height: 656px; display: block;">
    <defs>
      <radialGradient id="k-field" cx="46%" cy="40%" r="62%">
        <stop offset="0%" stop-color="#f5f3ec"></stop>
        <stop offset="64%" stop-color="#edebe4"></stop>
        <stop offset="100%" stop-color="#c6c3b9"></stop>
      </radialGradient>
      <clipPath id="k-clip"><circle cx="320" cy="320" r="301"></circle></clipPath>
    </defs>

    <circle cx="320" cy="320" r="311" fill="none" stroke="#1c1c1a" stroke-width="16"></circle>
    <circle cx="320" cy="320" r="302" fill="none" stroke="#6f6c65" stroke-width="3"></circle>
    <circle cx="320" cy="320" r="301" fill="url(#k-field)"></circle>

    <g clip-path="url(#k-clip)">
      <g fill="none" stroke="#14130e" stroke-width="2" opacity="0.6">
        <circle cx="320" cy="320" r="134"></circle>
        <circle cx="320" cy="320" r="182"></circle>
        <circle cx="320" cy="320" r="230"></circle>
      </g>
      <circle cx="320" cy="320" r="94" fill="#14130e"></circle>
      <g fill="none" stroke="#edebe4" stroke-width="1.6" opacity="0.42">
        <circle cx="320" cy="320" r="62"></circle>
        <circle cx="320" cy="320" r="30"></circle>
      </g>

      <g stroke-linecap="butt">
        <g stroke="#edebe4" stroke-width="7" opacity="0.3">
          <line x1="176" y1="320" x2="464" y2="320"></line>
          <line x1="320" y1="176" x2="320" y2="464"></line>
        </g>
        <g stroke="#14130e" stroke-width="2.4" opacity="0.88">
          <line x1="176" y1="320" x2="464" y2="320"></line>
          <line x1="320" y1="176" x2="320" y2="464"></line>
        </g>
        <g stroke="#14130e" stroke-width="13" opacity="0.92">
          <line x1="6" y1="320" x2="176" y2="320"></line>
          <line x1="464" y1="320" x2="634" y2="320"></line>
          <line x1="320" y1="6" x2="320" y2="176"></line>
          <line x1="320" y1="464" x2="320" y2="634"></line>
        </g>
      </g>

      <g fill="#050506" stroke="#cfcbbf" stroke-width="1.8">
        <circle cx="236" cy="236" r="6.5"></circle>
        <circle cx="286" cy="252" r="6.5"></circle>
        <circle cx="256" cy="284" r="6.5"></circle>
        <circle cx="296" cy="222" r="6.5"></circle>
        <circle cx="258" cy="258" r="6.5"></circle>
      </g>

      <ellipse cx="266" cy="250" rx="51" ry="47" transform="rotate(-12 266 250)" fill="#3987e5" fill-opacity="0.1" stroke="#3987e5" stroke-width="2.2" stroke-dasharray="8 6" opacity="0.92"></ellipse>

      <line x1="320" y1="320" x2="266" y2="250" stroke="#edebe4" stroke-width="1.8" stroke-dasharray="5 5" opacity="0.6"></line>
      <g stroke="#e0483f" stroke-width="3" stroke-linecap="round">
        <line x1="255" y1="250" x2="277" y2="250"></line>
        <line x1="266" y1="239" x2="266" y2="261"></line>
      </g>

      <g fill="none" stroke="#3987e5" stroke-width="3.2">
        <circle cx="236" cy="236" r="15"></circle>
        <circle cx="286" cy="252" r="15"></circle>
        <circle cx="256" cy="284" r="15"></circle>
        <circle cx="296" cy="222" r="15"></circle>
        <circle cx="258" cy="258" r="15"></circle>
      </g>
    </g>
  </svg>

  <div style="position: absolute; left: 1010px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 20px;">
    <div style="font-size: 92px; font-weight: 700; line-height: 0.94; letter-spacing: 0.01em; color: #ffffff;">S.P.O.T.S</div>
    <div class="mono" style="font-size: 14px; font-weight: 400; letter-spacing: 0.16em; text-transform: uppercase; color: #898781; max-width: 400px; line-height: 1.7;">Shot placement and<br>optical target scoring</div>
  </div>

</div>

</body>
</html>
